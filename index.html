<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渦虫技研 | 高専祭展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #050505;
            color: #e5e7eb;
            overflow-x: hidden;
        }

        /* ネオンエフェクト定義 */
        .neon-text-red {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #ef4444, 0 0 30px #ef4444, 0 0 40px #ef4444;
            color: #fca5a5;
        }
        .neon-text-green {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #22c55e, 0 0 30px #22c55e, 0 0 40px #22c55e;
            color: #bbf7d0;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #06b6d4, 0 0 30px #06b6d4, 0 0 40px #06b6d4;
            color: #a5f3fc;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #eab308, 0 0 30px #eab308, 0 0 40px #eab308;
            color: #fef08a;
        }

        .rotate-slight {
            transform: rotate(-3deg);
        }
        
        .image-frame-red {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6), inset 0 0 10px rgba(239, 68, 68, 0.4);
            border: 2px solid #ef4444;
        }
        .image-frame-green {
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6), inset 0 0 10px rgba(34, 197, 94, 0.4);
            border: 2px solid #22c55e;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <main class="w-full max-w-4xl relative">
        
        <!-- ヘッダー / ロゴエリア（画像に変更） -->
        <header class="flex justify-center mb-16 mt-8">
            <!-- ▼▼▼ ここにロゴ画像のファイル名を入れてください ▼▼▼ -->
            <img src="ここにロゴの画像.png" alt="渦虫技研 uzumushi tech" class="w-full max-w-24 md:max-w-32 object-contain">
        </header>

        <!-- 工事中エリア（CSS再現） -->
        <div class="mt-8 mb-4 flex justify-center">
            <div class="bg-yellow-400 border-4 border-red-600 text-red-600 p-4 w-48 text-center rounded-sm shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                <div class="text-4xl mb-2">🚧</div>
                <div class="text-4xl font-bold tracking-widest flex flex-col gap-2">
                    <span>工</span>
                    <span>事</span>
                    <span>中</span>
                </div>
            </div>
        </div>

        <!-- コンテンツエリア：左右（上下）の配置 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 relative">
            
            <!-- 左側（上部）：幻灯 / 電光掲示板 -->
            <section class="flex flex-col items-center md:items-start rotate-slight relative z-20">
                <h2 class="text-5xl md:text-6xl font-bold neon-text-red mb-2">幻灯</h2>
                
                <a href="denkou.html" class="block w-full max-w-sm mb-4 relative group cursor-pointer">
                    <div class="aspect-square bg-gray-900 image-frame-red rounded-sm overflow-hidden relative transition-transform group-hover:scale-105">
                        
                        <!-- ▼▼▼ ここに電光掲示板の画像ファイル名を入れてください ▼▼▼ -->
                        <img src="ここに電光掲示板の画像.jpg" alt="電光掲示板" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        
                        <div class="absolute inset-0 flex items-center justify-center text-red-500/50 pointer-events-none">
                            
                        </div>
                    </div>
                </a>
                
                <h3 class="text-3xl md:text-4xl font-bold neon-text-cyan mt-2">古き良き3色</h3>
            </section>

            <!-- 右側（下部）：翠球 / ハロ -->
            <section class="flex flex-col items-center md:items-end rotate-slight relative md:-mt-24 z-10">
                <h2 class="text-5xl md:text-6xl font-bold neon-text-green mb-2 text-right">翠球</h2>
                
                <a href="haro.html" class="block w-full max-w-sm mb-4 relative group cursor-pointer">
                    <div class="aspect-square bg-gray-900 image-frame-green rounded-full overflow-hidden relative transition-transform group-hover:scale-105">
                        
                        <!-- ▼▼▼ ここにハロの画像ファイル名を入れてください ▼▼▼ -->
                        <img src="ここにハロの画像.png" alt="ハロ" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                        
                        <div class="absolute inset-0 flex items-center justify-center text-green-500/50 pointer-events-none">
                            
                        </div>
                    </div>
                </a>
                
                <h3 class="text-3xl md:text-4xl font-bold neon-text-yellow mt-2 text-right">動く！光る！<br>ハロ！！！</h3>
            </section>
            
        </div>

        <!-- フッターエリア：ロケーション -->
        <footer class="mt-20 pt-8 border-t border-gray-800 flex justify-start items-end">
            <div>
                <h4 class="text-3xl mb-4 tracking-widest text-white">LOCATION</h4>
                <p class="text-2xl text-gray-300">
                    &gt;&gt; <span class="text-white bg-black px-2 font-bold">3IHR教室</span> (教養棟3F)
                </p>
            </div>
        </footer>
        
    </main>

</body>
</html>
