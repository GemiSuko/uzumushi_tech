<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渦虫技研 | 高専祭展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- レトロなドットフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DotGothic16', sans-serif;
            background-color: #050505;
            background-image: radial-gradient(#1f2937 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* ネオン発光エフェクト */
        .neon-green { text-shadow: 0 0 10px rgba(74, 222, 128, 0.8), 0 0 20px rgba(74, 222, 128, 0.6); }
        .neon-pink { text-shadow: 0 0 10px rgba(217, 70, 239, 0.8), 0 0 20px rgba(217, 70, 239, 0.6); }
        .neon-yellow { text-shadow: 0 0 10px rgba(250, 204, 21, 0.8), 0 0 20px rgba(250, 204, 21, 0.6); }
        /* 電光掲示板風の枠 */
        .led-border { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4), inset 0 0 15px rgba(239, 68, 68, 0.2); }
        /* ハロ風の枠 */
        .haro-border { box-shadow: 0 0 15px rgba(74, 222, 128, 0.4), inset 0 0 15px rgba(74, 222, 128, 0.2); }
    </style>
</head>
<body class="text-gray-100 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        
        <!-- ヘッダー -->
        <header class="text-center mb-12 mt-8">
            <div class="inline-block border-4 border-gray-400 p-4 mb-4">
                <h1 class="text-5xl md:text-6xl font-bold tracking-widest text-gray-200">
                    渦虫技研
                </h1>
            </div>
            <p class="text-gray-400 text-xl tracking-widest">uzumushi tech</p>
        </header>

        <!-- 工事中エリア（CSS再現） -->
        <div class="mt-8 mb-4 flex justify-center">
            <div class="bg-yellow-400 border-4 border-red-600 text-red-600 p-4 w-48 text-center rounded-sm shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                <div class="text-4xl mb-2">🚧</div>
                <div class="text-4xl font-bold tracking-widest flex flex-col gap-2">
                    <span>工</span>
                    <span>事</span>
                    <span>中</span>
                </div>
            </div>
        </div>
        
        <!-- ロケーション情報 -->
        <div class="bg-black/60 border border-gray-700 p-6 rounded-lg mb-12 text-center backdrop-blur-sm">
            <p class="text-2xl tracking-widest">
                LOCATION &gt;&gt; <span class="neon-green text-green-400">3IHR (教養棟3F)</span>
            </p>
        </div>

        <!-- 展示内容 -->
        <div class="space-y-12">
            
            <!-- 電光掲示板 -->
            <div class="bg-black/80 border-2 border-red-900 p-6 rounded-xl flex flex-col md:flex-row items-center gap-6 led-border backdrop-blur-sm">
                <!-- 画像配置枠（srcの中身を実際の画像ファイル名に変更してください） -->
                <div class="w-full md:w-1/2 aspect-video bg-gray-800 flex items-center justify-center border border-red-500 overflow-hidden">
                    <img src="ここに電光掲示板の画像.jpg" alt="電光掲示板" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
                    <!-- 画像がない場合は以下のテキストが表示されます -->
                    <span class="absolute text-red-500/50">NO IMAGE</span>
                </div>
                <div class="w-full md:w-1/2">
                    <h2 class="text-4xl text-red-500 mb-2 font-bold tracking-widest">幻灯</h2>
                    <h3 class="text-2xl neon-pink text-fuchsia-400 mb-4 tracking-widest">古き良き3色</h3>
                    <p class="text-gray-300 leading-relaxed text-lg">
                        ハードウェアから制御プログラムまで、一から組み上げたオリジナルの電光掲示板。
                    </p>
                </div>
            </div>

            <!-- ハロ型ロボット -->
            <div class="bg-black/80 border-2 border-green-900 p-6 rounded-xl flex flex-col md:flex-row-reverse items-center gap-6 haro-border backdrop-blur-sm">
                <!-- 画像配置枠（srcの中身を実際の画像ファイル名に変更してください） -->
                <div class="w-full md:w-1/2 aspect-video bg-gray-800 flex items-center justify-center border border-green-500 overflow-hidden relative">
                    <img src="ここにハロの画像.jpg" alt="ハロ型ロボット" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-opacity">
                    <!-- 画像がない場合は以下のテキストが表示されます -->
                    <span class="absolute text-green-500/50">NO IMAGE</span>
                </div>
                <div class="w-full md:w-1/2 md:text-right">
                    <h2 class="text-4xl text-green-400 mb-2 font-bold tracking-widest neon-green">翠球</h2>
                    <h3 class="text-2xl neon-yellow text-yellow-400 mb-4 tracking-widest">動く！光る！ハロ！！！</h3>
                    <p class="text-gray-300 leading-relaxed text-lg md:text-right text-left">
                        あの「ハロ」をモチーフにした小型ロボット。こだわりの内部機構と愛らしい動作をお楽しみください。
                    </p>
                </div>
            </div>

        </div>

        <!-- フッター -->
        <footer class="mt-20 mb-8 text-center text-gray-500">
            <p class="tracking-widest text-lg">Details</p>
            <p class="mt-2">&copy; 2026 渦虫技研</p>
        </footer>
        
    </div>
</body>
</html>
